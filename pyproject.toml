[project]
name = "enody-home-assistant"
version = "0.1.0"
description = "Home Assistant custom integration for Enody devices"
requires-python = ">=3.13.0"
readme = "README.md"
dependencies = [
    "enody==0.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-homeassistant-custom-component==0.13.232",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
